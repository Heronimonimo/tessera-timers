# A whole firmware with the plugin, as the Tessera add-on builds it: Tessera's screen package at a release, the add-on's
# ESPHome, and this plugin beside it. Two screens: the reTerminal D1001, whose board brings a speaker, with the part
# parts/sound.yaml (the alarm), and the CYD, which has none, without it. The preview bench builds for a computer and
# has no audio, so only this build shows that the sound compiles.
name: build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      tessera_ref:
        description: Tessera ref to build against (a screens-v* tag or a branch)
        default: screens-v0.4.89
      esphome:
        description: ESPHome version (the Tessera add-on's)
        default: 2026.9.0

env:
  TESSERA_REF: ${{ inputs.tessera_ref || 'screens-v0.4.89' }}
  ESPHOME_VERSION: ${{ inputs.esphome || '2026.9.0' }}

jobs:
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { board: reterminald1001, sound: true }
          - { board: cyd, sound: false }
    name: firmware (${{ matrix.board }}${{ matrix.sound && ', sound' || '' }})
    steps:
      - uses: actions/checkout@v4
        with: { path: plugin }
      - uses: actions/checkout@v4
        with:
          repository: MaxGramser/homeassistant_espscreen
          ref: ${{ env.TESSERA_REF }}
          path: tessera
      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }
      - run: python -m pip install "esphome==${ESPHOME_VERSION}"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/esphome
          key: esphome-${{ runner.os }}-${{ matrix.board }}-${{ env.ESPHOME_VERSION }}-${{ env.TESSERA_REF }}
          restore-keys: esphome-${{ runner.os }}-${{ matrix.board }}-${{ env.ESPHOME_VERSION }}-
      - name: Screen with the plugin
        working-directory: tessera/checkout
        run: |
          # Throwaway secrets: this firmware is only built, never flashed.
          cat > secrets.yaml <<EOF
          wifi_ssid: "ci"
          wifi_password: "ci-password"
          api_encryption_key: "$(head -c 32 /dev/urandom | base64)"
          ota_password: "ci-ota"
          ap_password: "ci-ap-password"
          EOF
          # As Tessera writes a screen's plugins file (docs/TESTING.md in tessera-plugins, "A build on your own computer").
          {
            echo "packages:"
            echo "  screen: !include ${{ matrix.board }}.yaml"
            echo "  plugin_timers: !include ../../plugin/plugin.yaml"
            if [ "${{ matrix.sound }}" = "true" ]; then echo "  plugin_timers_sound: !include ../../plugin/parts/sound.yaml"; fi
            echo "external_components:"
            echo "  - source: { type: local, path: ../../plugin/components }"
          } > ci-timers.yaml
          cat ci-timers.yaml
      - name: esphome compile
        working-directory: tessera/checkout
        run: esphome compile ci-timers.yaml
      - name: The alarm is in the firmware
        if: matrix.sound
        working-directory: tessera/checkout
        run: |
          build=$(ls -d .esphome/build/*/ | head -1)
          grep -rq "done_sound" "$build/src" && echo "The alarm sound is built in." || { echo "No alarm sound in the build"; exit 1; }
